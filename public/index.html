<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Shortlist – Applicant tracking</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main id="auth" hidden>
  <form id="authForm" class="auth-card">
    <h1>Shortlist</h1>
    <p id="authLead">Sign in to manage your hiring pipeline.</p>
    <label id="nameRow" hidden>Full name<input name="name" autocomplete="name"></label>
    <label>Email<input name="email" type="email" required autocomplete="email"></label>
    <label>Password<input name="password" type="password" minlength="6" required autocomplete="current-password"></label>
    <p id="authErr" class="err" role="alert"></p>
    <button class="btn primary" id="authBtn">Sign in</button>
    <button type="button" class="link" id="authSwitch">Create an account</button>
  </form>
</main>

<div id="app" hidden>
  <header class="top">
    <strong class="brand">Shortlist</strong>
    <span><span id="who"></span> <button class="link" id="logout">Sign out</button></span>
  </header>
  <section class="stats" aria-label="Dashboard">
    <div><b id="sTotal">0</b><span>Candidates</span></div>
    <div><b id="sActive">0</b><span>In progress</span></div>
    <div><b id="sWeek">0</b><span>Added this week</span></div>
    <div><b id="sRate">0%</b><span>Hired</span></div>
    <div><b id="sRoles" class="small">–</b><span>Busiest roles</span></div>
  </section>
  <nav id="pipeline" class="pipeline" aria-label="Filter by stage"></nav>
  <section class="toolbar">
    <input id="search" type="search" placeholder="Search name, email, role or skill">
    <button class="btn primary" id="addBtn">Add candidate</button>
  </section>
  <div class="table-wrap">
    <table>
      <thead><tr><th>Candidate</th><th>Role</th><th>Skills</th><th>Exp.</th><th>Stage</th><th></th></tr></thead>
      <tbody id="rows"></tbody>
    </table>
    <p id="empty" class="empty" hidden></p>
  </div>
  <footer class="pager"><button class="btn" id="prev">Previous</button><span id="pageInfo"></span><button class="btn" id="next">Next</button></footer>
</div>

<dialog id="dlg">
  <form id="candForm" method="dialog">
    <h2 id="dlgTitle">Add candidate</h2>
    <input type="hidden" name="id">
    <div class="grid">
      <label>Name<input name="name" required></label>
      <label>Email<input name="email" type="email" required></label>
      <label>Phone<input name="phone"></label>
      <label>Role applied for<input name="role" required></label>
      <label>Skills (comma separated)<input name="skills" placeholder="React, Node, SQL"></label>
      <label>Years of experience<input name="experience" type="number" min="0" step="0.5" value="0"></label>
      <label>Stage<select name="stage"></select></label>
    </div>
    <label>Notes<textarea name="notes" rows="3"></textarea></label>
    <p id="formErr" class="err" role="alert"></p>
    <div class="actions"><button type="button" class="btn" id="cancel">Cancel</button><button class="btn primary">Save candidate</button></div>
  </form>
</dialog>
<div id="toast" role="status"></div>
<script src="app.js"></script>
</body>
</html>
